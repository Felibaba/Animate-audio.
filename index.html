<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talking Host — Enhanced</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9ecf2;--card:#fff;--ink:#12151c;--bd:#c9cfdb;--ac:#2f6bff;--acx:#fff;--mut:#5b6478;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07090f;--card:#141a26;--ink:#e8ecf5;--bd:#2a3142;--mut:#9aa5bd}}
:root[data-theme="dark"]{--bg:#07090f;--card:#141a26;--ink:#e8ecf5;--bd:#2a3142;--mut:#9aa5bd}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 Rubik,system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 12px 28px}
canvas{width:min(100%,520px);height:auto;border-radius:24px;display:block;box-shadow:0 24px 50px -20px rgba(0,0,0,.55)}
.pn{width:min(100%,520px);background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px}
textarea,input[type=text],input[type=password],select{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;margin:6px 0}
textarea{height:110px;resize:vertical;font-size:16px}
.r{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}.r select{width:auto;flex:1;margin:0}
button,.dl{font:inherit;font-weight:700;color:inherit;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
button.a,.dl{background:var(--ac);color:var(--acx);border-color:var(--ac)}
button:disabled{opacity:.5}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #ff7a2f;outline-offset:2px}
small{color:var(--mut)}[hidden]{display:none!important}
.bar{height:8px;background:var(--bg);border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .2s}
#sp[data-k=err] b{color:#e03131}#sp[data-k=ok] b{color:#2f9e44}
</style>
</head>
<body>
<canvas id="c" width="684" height="720" aria-label="Animated host who speaks your script with live captions" role="img"></canvas>
<div class="pn"><b>What should he say?</b>
<textarea id="sc" aria-label="Script"></textarea><small id="cn"></small>
<div class="r"><button class="a" id="go">▶ Play</button><button id="rc">⏺ Save video</button><select id="ql" aria-label="Video size"><option value="684">684×720</option><option value="1080">1080×1138 (HD)</option></select></div>
<div class="r"><button id="ub">🎵 Upload audio</button><button id="ux" hidden>✕ Remove</button><input type="file" id="af" accept="audio/*,video/mp4" hidden></div><small id="au" aria-live="polite"></small>
<div class="r"><small>Speed</small><input type="range" id="rt" min=".6" max="1.4" step=".05" value=".8" style="flex:1" aria-label="Speech speed"><small id="rl" style="min-width:84px;text-align:right"></small></div>
<div id="sp" hidden><div class="r" style="justify-content:space-between"><b id="sl"></b><span id="sx"></span></div><div class="bar"><i id="sb"></i></div><small id="sd"></small><div class="r"><a id="dl" class="dl" hidden></a><button id="cx" hidden>Cancel</button></div></div></div>
<details class="pn" id="vs"><summary><b>🔊 Voice server</b> <small>(optional · used only when no audio is uploaded)</small></summary>
<input type="text" id="tu" placeholder="https://YOUR-SERVER.onrender.com/tts" autocapitalize="off" autocorrect="off">
<input type="password" id="tk" placeholder="API key (optional)">
<div class="r"><button id="tt">Test voice</button><select id="vo" aria-label="Browser voice"></select></div>
<small>Empty URL = browser voice (preview only). Saving a video needs uploaded audio or your server; it can return audio directly or JSON with a url / audio_url.</small></details>
